# ═══════════════════════════════════════════════════════════
# Clash Verge Rev (mihomo) — macOS 全局 TUN
#
# 4 个节点 = 4 个不同的出口 IP，名字里写的就是网站看到的地址：
#
#   直出 <中转1IP>        Mac ──Reality──▶ 中转1 ──▶ 网站        出口 = 中转1 自己
#   直出 <中转2IP>        Mac ──Reality──▶ 中转2 ──▶ 网站        出口 = 中转2 自己
#   <中转1> → <落地1IP>   Mac ──Reality──▶ 中转1 ──socks5──▶ 落地1
#   <中转2> → <落地2IP>   Mac ──Reality──▶ 中转2 ──socks5──▶ 落地2
#
# 全部走 VLESS-Reality 加密，落地代理的账号密码只存在中转机上，
# 不出现在这份配置里。
#
# 占位符由 render.sh 填。
# ═══════════════════════════════════════════════════════════

mixed-port: 7897
allow-lan: false
bind-address: "127.0.0.1"
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  mtu: 1500

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "+.home.arpa"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "captive.apple.com"
    - "time.*.com"
    - "time.*.apple.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "localhost.ptlogin2.qq.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.xboxlive.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver-policy:
    "geosite:cn,private":
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.push.apple.com"

# ─── 节点 ─────────────────────────────────────────────────
proxies:
  # ① 中转1 直出（出口就是中转1 的 IP）
  - name: "__N1__"
    type: vless
    server: __R1__
    port: __PORT0__
    uuid: __UUID__
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: __DEST__
    client-fingerprint: chrome
    reality-opts:
      public-key: __PUBLIC_KEY__
      short-id: "__SHORT_ID__"

  # ② 中转2 直出（出口就是中转2 的 IP）
  - name: "__N2__"
    type: vless
    server: __R2__
    port: __PORT0__
    uuid: __UUID__
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: __DEST__
    client-fingerprint: chrome
    reality-opts:
      public-key: __PUBLIC_KEY__
      short-id: "__SHORT_ID__"

  # ③ 中转1 → 落地1
  - name: "__N3__"
    type: vless
    server: __R1__
    port: __PORT1__
    uuid: __UUID__
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: __DEST__
    client-fingerprint: chrome
    reality-opts:
      public-key: __PUBLIC_KEY__
      short-id: "__SHORT_ID__"

  # ④ 中转2 → 落地2
  - name: "__N4__"
    type: vless
    server: __R2__
    port: __PORT2__
    uuid: __UUID__
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: __DEST__
    client-fingerprint: chrome
    reality-opts:
      public-key: __PUBLIC_KEY__
      short-id: "__SHORT_ID__"

# 只留一个选择器，界面上就是 4 个节点 + 这一个分组
proxy-groups:
  - name: PROXY
    type: select
    proxies: ["__N1__", "__N2__", "__N3__", "__N4__", DIRECT]

# ─── 规则 ─────────────────────────────────────────────────
rules:
  # 两台中转机自身的流量必须直连，否则成环
  - IP-CIDR,__R1__/32,DIRECT,no-resolve
  - IP-CIDR,__R2__/32,DIRECT,no-resolve

  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,category-ads-all,REJECT

  - GEOSITE,geolocation-!cn,PROXY
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT

  - MATCH,PROXY
