# ═══════════════════════════════════════════════════════════
# Clash Verge Rev (mihomo) — macOS 全局 TUN
#
# 链路： Mac --VLESS-Reality--> 中转VPS --SOCKS5/HTTP--> 落地代理 --> 互联网
#
# 4 个节点 = 2 中转 × 2 落地。中转上一个端口对应一个落地，
# 所以在 GUI 里切节点就等于切「走哪台中转 + 从哪个落地出去」。
#
# 占位符（用 render.sh 自动填）：
#   __R1__ __R2__            两台中转机 IP
#   __PORT1__ __PORT2__      中转机上对应落地1 / 落地2 的端口
#   __UUID__ __PUBLIC_KEY__ __SHORT_ID__ __DEST__   中转机脚本输出的凭据
#   __N11__ __N12__ __N21__ __N22__                 四个节点名，render.sh 自动拼
#
# 节点名格式：「中转IP前两段 → 落地出口IP」。箭头右边就是网站看到的你的 IP。
# ═══════════════════════════════════════════════════════════

mixed-port: 7897
allow-lan: false
bind-address: "127.0.0.1"
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

# ─── TUN（全局接管）───────────────────────────────────────
# Clash Verge Rev 的 GUI「Tun Mode」开关会覆盖这一段，以 GUI 为准。
# 这里保留是给直接跑 mihomo 二进制的场景用的。
tun:
  enable: true
  stack: gvisor          # macOS 上兼容性最好；想更快可试 mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: false    # macOS 上开 true 容易和其他 VPN/虚拟机打架
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  mtu: 1500

# ─── DNS ─────────────────────────────────────────────────
# 走代理的域名用 fake-ip，不在本地解析，域名原样传到落地代理去解析：
# 既不会 DNS 泄露，流媒体的地区判断也跟着落地 IP 走。
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "+.home.arpa"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "captive.apple.com"
    - "time.*.com"
    - "time.*.apple.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "localhost.ptlogin2.qq.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.xboxlive.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver-policy:
    "geosite:cn,private":
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.push.apple.com"

# ─── 节点 ─────────────────────────────────────────────────
proxies:
  - name: "__N11__"          # 中转1 → 落地1
    type: vless
    server: __R1__
    port: __PORT1__
    uuid: __UUID__
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: __DEST__
    client-fingerprint: chrome
    reality-opts:
      public-key: __PUBLIC_KEY__
      short-id: "__SHORT_ID__"

  - name: "__N12__"          # 中转1 → 落地2
    type: vless
    server: __R1__
    port: __PORT2__
    uuid: __UUID__
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: __DEST__
    client-fingerprint: chrome
    reality-opts:
      public-key: __PUBLIC_KEY__
      short-id: "__SHORT_ID__"

  - name: "__N21__"          # 中转2 → 落地1
    type: vless
    server: __R2__
    port: __PORT1__
    uuid: __UUID__
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: __DEST__
    client-fingerprint: chrome
    reality-opts:
      public-key: __PUBLIC_KEY__
      short-id: "__SHORT_ID__"

  - name: "__N22__"          # 中转2 → 落地2
    type: vless
    server: __R2__
    port: __PORT2__
    uuid: __UUID__
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: __DEST__
    client-fingerprint: chrome
    reality-opts:
      public-key: __PUBLIC_KEY__
      short-id: "__SHORT_ID__"

proxy-groups:
  - name: PROXY
    type: select
    proxies: [自动选择, "__N11__", "__N12__", "__N21__", "__N22__", DIRECT]

  - name: 自动选择
    type: url-test
    proxies: ["__N11__", "__N12__", "__N21__", "__N22__"]
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  # 流媒体单独一组：落地 IP 决定能不能解锁，两个落地可以分别试
  - name: 国外媒体
    type: select
    proxies: [PROXY, "__N11__", "__N12__", "__N21__", "__N22__"]

# ─── 规则 ─────────────────────────────────────────────────
rules:
  # 中转机自身流量必须直连，否则成环
  - IP-CIDR,__R1__/32,DIRECT,no-resolve
  - IP-CIDR,__R2__/32,DIRECT,no-resolve

  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,category-ads-all,REJECT

  - GEOSITE,youtube,国外媒体
  - GEOSITE,netflix,国外媒体
  - GEOSITE,disney,国外媒体
  - GEOSITE,spotify,国外媒体

  - GEOSITE,geolocation-!cn,PROXY
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT

  - MATCH,PROXY
